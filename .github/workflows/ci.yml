name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same PR or branch cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  STORYBOOK_DISABLE_TELEMETRY: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # pnpm doesn't exist yet at this point; the store is cached below.
          package-manager-cache: false

      # Installs the pnpm version pinned in package.json ("packageManager").
      # Corepack is updated first: Node's bundled copy can lag behind and fail
      # to verify newer pnpm releases.
      - name: Enable pnpm
        run: |
          npm install --global corepack@latest
          corepack enable
          pnpm --version

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      # Each Turbo task builds @dsai/ui first (docs and Storybook use its dist).
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (ui, docs, Storybook)
        run: pnpm build

      - name: Check npm package contents
        run: node scripts/check-pack.mjs
